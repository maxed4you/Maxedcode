# Every push to main and every pull request: the test suites on Windows, Linux and macOS, and a real install
# with install.sh on Linux and macOS (the venv, program/bin/maxed, ~/.local/bin/maxed, uninstall).
name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -q "openai>=2.0" "ddgs>=3.0" "textual>=2.0" "mcp>=2" pillow rich pytest
      - name: Run the test suites
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          MAXEDCODE_OFFLINE: "1"
          PYTHONUTF8: "1"
        run: |
          cd agent
          python run_all_tests.py --serial
      - name: Run the test suites (Linux / macOS)
        if: runner.os != 'Windows'
        shell: bash
        env:
          MAXEDCODE_OFFLINE: "1"
          PYTHONUTF8: "1"
        run: |
          cd agent
          python run_all_tests.py --serial
      - name: The npm launcher parses
        shell: bash
        run: |
          node --check bin/maxedcode.js
          node bin/maxedcode.js --npm-version

  posix-install:
    # install.sh from this checkout into a temporary home: the venv and its packages, the launcher, the link,
    # the menu entries / maxedcode.app, README.txt, maxed --update (offline: nothing to do), maxed uninstall
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install.sh, then the installed launcher
        shell: bash
        env:
          MAXEDCODE_OFFLINE: "1"
        run: |
          set -eux
          export HOME="$RUNNER_TEMP/home" XDG_DATA_HOME="$RUNNER_TEMP/home/.local/share"
          mkdir -p "$HOME"
          dir="$RUNNER_TEMP/mx"
          MAXEDCODE_SRC="$GITHUB_WORKSPACE" MAXEDCODE_YES=1 MAXEDCODE_ARGS="--dir $dir --base-url 127.0.0.1:8080" sh install.sh
          test -x "$dir/program/bin/maxed"
          test -f "$dir/README.txt"
          "$dir/program/.venv/bin/python" -c "import openai, ddgs, textual, rich, PIL, mcp"
          test -L "$HOME/.local/bin/maxed" || test -x "$HOME/.local/bin/maxed"
          if [ "$RUNNER_OS" = "macOS" ]; then
            test -x "$HOME/Applications/maxedcode.app/Contents/MacOS/maxedcode"
            plutil -lint "$HOME/Applications/maxedcode.app/Contents/Info.plist"
          else
            test -f "$XDG_DATA_HOME/applications/maxedcode.desktop"
            grep -q "^Exec=.*maxed\"\? app$" "$XDG_DATA_HOME/applications/maxedcode.desktop"
          fi
          grep -q "added by maxedcode setup" "$HOME/.bashrc" "$HOME/.zshrc" "$HOME/.bash_profile" 2>/dev/null
          "$HOME/.local/bin/maxed" --update
          "$dir/program/bin/maxed" uninstall --yes
          test ! -e "$dir"
          test ! -e "$HOME/.local/bin/maxed"
          if grep -q "added by maxedcode setup" "$HOME/.bashrc" "$HOME/.zshrc" "$HOME/.bash_profile" 2>/dev/null; then exit 1; fi
          if [ "$RUNNER_OS" = "macOS" ]; then test ! -e "$HOME/Applications/maxedcode.app"
          else test ! -e "$XDG_DATA_HOME/applications/maxedcode.desktop"; fi
