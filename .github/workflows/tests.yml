# Every push to main and every pull request: the test suites on Windows.
name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -q "openai>=2.0" "ddgs>=3.0" "textual>=2.0" "mcp>=2" pillow rich pytest
      - name: Run the test suites
        shell: pwsh
        env:
          MAXEDCODE_OFFLINE: "1"
          PYTHONUTF8: "1"
        run: |
          cd agent
          python run_all_tests.py --serial
