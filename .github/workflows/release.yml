# A v* tag (the author's release button, or git tag v1.0.1 && git push origin v1.0.1; package.json and
# agent/maxedcode/version.py carry the same number) builds Maxedcode_setup.zip and maxedcode.zip, publishes the npm
# package with the tag's version (trusted publishing: set up once on npmjs.com, package maxedcode -> Settings ->
# Trusted Publisher -> GitHub Actions, maxed4you/Maxedcode, release.yml), waits until npm really serves it, and only
# then makes the GitHub release. The release is what installs update themselves from and what people read: made
# earlier, `npm install -g maxedcode` failed with 404 for the first minutes (and npm's CDN kept that 404 for 5 more).
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  setup-zip:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: The tag, package.json and maxedcode/version.py agree
        # installs update themselves by version.py (maxedcode/update.py): a release with another number in it
        # would be downloaded again every day
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $tag = "$env:GITHUB_REF_NAME".TrimStart('v')
          $pkg = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $py = [regex]::Match((Get-Content agent/maxedcode/version.py -Raw), 'VERSION\s*=\s*"([^"]+)"').Groups[1].Value
          if ($tag -ne $pkg -or $tag -ne $py) { throw "tag $tag, package.json $pkg, version.py $py must be the same" }
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Installer tests
        if: hashFiles('agent/tests/test_installer.py') != ''
        shell: pwsh
        env:
          MAXEDCODE_OFFLINE: "1"
        run: |
          python -m pip install -q pytest
          cd agent
          python -m pytest -q tests/test_installer.py
      - name: Build Maxedcode_setup.zip and maxedcode.zip
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File installer/build.ps1
          # the program alone (installer/app: no tests, no docs) for install.ps1, as opencode ships a built package
          Compress-Archive -Path installer/app/* -DestinationPath installer/maxedcode.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: Maxedcode_setup
          path: |
            installer/Maxedcode_setup.zip
            installer/maxedcode.zip

  npm:
    needs: setup-zip
    # Publishing makes the code public: only for a tag, and only from a public repository.
    if: startsWith(github.ref, 'refs/tags/') && github.event.repository.private == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write          # npm trusted publishing (OIDC): no token to store or renew
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"   # npm 11.5+ is needed for trusted publishing
          registry-url: "https://registry.npmjs.org"
      - name: Publish to npm
        run: |
          version="${GITHUB_REF_NAME#v}"
          if npm view "maxedcode@$version" version >/dev/null 2>&1; then
            echo "maxedcode@$version is already on npm"; exit 0
          fi
          npm version "$version" --no-git-tag-version --allow-same-version
          npm publish --access public
      - name: Wait until npm serves it
        # nobody asks for the package before this (the release does not exist yet), so no 404 gets cached
        run: |
          url="https://registry.npmjs.org/maxedcode/-/maxedcode-${GITHUB_REF_NAME#v}.tgz"
          for i in $(seq 1 60); do
            if [ "$(curl -s -o /dev/null -w '%{http_code}' "$url")" = "200" ]; then echo "on npm: $url"; exit 0; fi
            sleep 10
          done
          echo "::warning::npm does not serve $url after 10 minutes; the release is made anyway"

  release:
    needs: [setup-zip, npm]
    # also when npm was skipped (a private repository): the zips still go out
    if: always() && startsWith(github.ref, 'refs/tags/') && needs.setup-zip.result == 'success' && needs.npm.result != 'failure'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Maxedcode_setup
          path: installer
      - name: Release notes (this version's part of CHANGELOG.md + how to install)
        shell: pwsh
        run: |
          $v = "$env:GITHUB_REF_NAME".TrimStart('v')
          $log = Get-Content CHANGELOG.md -Raw
          $m = [regex]::Match($log, "(?ms)^## $([regex]::Escape($v))[ \t]*\r?\n(.*?)(?=^## |\z)")
          $what = if ($m.Success) { $m.Groups[1].Value.Trim() } else { "" }
          $install = (Get-Content .github/release-install.md -Raw).Trim()
          Set-Content release-notes.md "$what`n`n$install`n" -Encoding utf8
          "MX_VERSION=$v" >> $env:GITHUB_ENV
      - name: The GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: maxedcode ${{ env.MX_VERSION }}
          body_path: release-notes.md
          files: |
            installer/Maxedcode_setup.zip
            installer/maxedcode.zip
          generate_release_notes: true
